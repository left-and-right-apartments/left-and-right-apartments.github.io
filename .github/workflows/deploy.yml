name: Update data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *" # every day, early morning in Greece
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Refresh Airbnb calendar and ratings
        run: node scripts/update-data.mjs
        env:
          AIRBNB_ICAL_LEFT: ${{ secrets.AIRBNB_ICAL_LEFT }}
          AIRBNB_ICAL_RIGHT: ${{ secrets.AIRBNB_ICAL_RIGHT }}

      - name: Commit refreshed data
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Refresh Airbnb data"
            git push
          fi

      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html robots.txt sitemap.xml assets data _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
